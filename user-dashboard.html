<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Lyfe Shift Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-color: #9B7EDE;
            --secondary-color: #C8B5E8;
            --accent-color: #E6D9F7;
            --text-dark: #4A4458;
            --text-light: #8B7FA3;
            --white: #FFFFFF;
            --light-bg: #FDFCFF;
            --gradient-primary: linear-gradient(135deg, #9B7EDE 0%, #B8A9D9 100%);
            --gradient-gold: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            --gold-accent: #D4AF37;
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        
        body {
            font-family: var(--font-body);
            line-height: 1.6;
            color: var(--text-dark);
            background: var(--light-bg);
            min-height: 100vh;
        }
        
        .header {
            background: var(--gradient-primary);
            color: white;
            padding: 1rem 0;
            box-shadow: var(--shadow);
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .nav-link {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .nav-link.home-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .nav-link.home-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .welcome-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        
        .welcome-title {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            color: var(--text-dark);
            margin-bottom: 10px;
        }
        
        .welcome-subtitle {
            color: var(--text-light);
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        
        .user-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        
        .stat-icon.workouts { color: #3498db; }
        .stat-icon.streak { color: #e74c3c; }
        .stat-icon.points { color: var(--gold-accent); }
        .stat-icon.rank { color: #9b59b6; }
        
        .stat-number {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: var(--text-light);
            font-weight: 500;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
        }
        
        .card-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .progress-section {
            margin-bottom: 20px;
        }
        
        .progress-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .progress-label {
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .progress-value {
            color: var(--primary-color);
            font-weight: 700;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--gradient-primary);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .action-btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        
        .action-btn.secondary {
            background: var(--gradient-gold);
        }
        
        .action-btn.collect-reward {
            background: var(--gradient-gold);
            font-size: 1.1rem;
            padding: 18px 25px;
            grid-column: 1 / -1;
        }
        
        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .leaderboard-item:last-child {
            border-bottom: none;
        }
        
        .rank-number {
            font-weight: 700;
            color: var(--primary-color);
            margin-right: 15px;
            min-width: 30px;
        }
        
        .user-info {
            flex: 1;
        }
        
        .user-name {
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .user-points {
            color: var(--text-light);
            font-size: 0.9rem;
        }
        
        .achievement-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: var(--light-bg);
            border-radius: 12px;
            margin-bottom: 10px;
        }
        
        .achievement-icon {
            font-size: 2rem;
            margin-right: 15px;
        }
        
        .achievement-info h4 {
            color: var(--text-dark);
            margin-bottom: 5px;
        }
        
        .achievement-info p {
            color: var(--text-light);
            font-size: 0.9rem;
        }
        
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            background: #c0392b;
        }
        
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .user-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .quick-actions {
                grid-template-columns: 1fr;
            }
            
            .welcome-title {
                font-size: 2rem;
            }
        }
        
        @media (max-width: 480px) {
            .user-stats {
                grid-template-columns: 1fr;
            }
            
            .main-container {
                padding: 20px 15px;
            }
            
            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                🏋️‍♂️ Lyfe Shift
            </div>
            <nav class="nav-links">
                <a href="index.html" class="nav-link home-btn">
                    <i class="fas fa-home"></i> Main Page
                </a>
                <a href="#" class="nav-link" onclick="showProfile()">
                    <i class="fas fa-user"></i> Profile
                </a>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </nav>
        </div>
    </header>
    
    <div class="main-container">
        <div class="welcome-section">
            <h1 class="welcome-title">Welcome Back, <span id="userName">Champion</span>!</h1>
            <p class="welcome-subtitle">Ready to crush your fitness goals today?</p>
        </div>
        
        <!-- User stats section removed for cleaner interface -->
        
        <div class="dashboard-grid">
            <div class="main-content">
                <!-- Progress section removed -->
                
                <div class="card">
                    <h2 class="card-title">
                        <i class="fas fa-bolt"></i>
                        Quick Actions
                    </h2>
                    <div class="quick-actions">
                        <a href="collect-reward.html" class="action-btn collect-reward">
                            <i class="fas fa-trophy"></i>
                            Collect Your Reward
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="sidebar">
                <div class="card">
                    <h3 class="card-title">
                        <i class="fas fa-crown"></i>
                        Top Performers
                    </h3>
                    <div style="text-align: center; padding: 40px 20px; color: var(--text-light);">
                        <i class="fas fa-trophy" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.3;"></i>
                        <p>Leaderboard will be updated soon!</p>
                    </div>
                </div>
                
                <!-- Recent achievements section removed -->
            </div>
        </div>
    </div>
    
    <script>
        // Load user data on page load
        window.addEventListener('load', function() {
            loadUserData();
            checkAuthStatus();
        });
        
        function checkAuthStatus() {
            const session = localStorage.getItem('lyfeshift_session') || sessionStorage.getItem('lyfeshift_session');
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            
            const sessionData = JSON.parse(session);
            document.getElementById('userName').textContent = sessionData.fullName || sessionData.username;
        }
        
        function loadUserData() {
            // User data loading simplified - no stats to display
        }
        
        // Removed workout logging and challenges functions
        
        function showProfile() {
            const session = localStorage.getItem('lyfeshift_session') || sessionStorage.getItem('lyfeshift_session');
            if (session) {
                const sessionData = JSON.parse(session);
                
                alert(`Profile Information:\n\nName: ${sessionData.fullName}\nUsername: ${sessionData.username}\nEmail: ${sessionData.email}`);
            }
        }
        
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('lyfeshift_session');
                sessionStorage.removeItem('lyfeshift_session');
                window.location.href = 'index.html';
            }
        }
        
        // Auto-save user activity
        setInterval(function() {
            const session = localStorage.getItem('lyfeshift_session') || sessionStorage.getItem('lyfeshift_session');
            if (session) {
                const sessionData = JSON.parse(session);
                sessionData.lastActivity = new Date().toISOString();
                
                if (localStorage.getItem('lyfeshift_session')) {
                    localStorage.setItem('lyfeshift_session', JSON.stringify(sessionData));
                } else {
                    sessionStorage.setItem('lyfeshift_session', JSON.stringify(sessionData));
                }
            }
        }, 60000); // Update every minute
    </script>
</body>
</html>
